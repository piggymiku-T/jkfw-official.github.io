        // ============================================================

        // ============================================================
        // 検索フィルター
        // ============================================================
        function filterCards() {
            const q = document.getElementById('search-input').value.trim().toLowerCase();
            document.querySelectorAll('#player-grid .card').forEach(card => {
                if (!q || card.dataset.search.includes(q)) {
                    card.style.display = '';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // ============================================================
        // 气泡特效（保持不变）
        // ============================================================
        (function() {
            const canvas = document.getElementById('bubble-canvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let particles = [];
            let lastMouseX = 0, lastMouseY = 0;
            let mouseMoveTimer = null;
            function resizeCanvas() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
            }
            function spawnBubbles(x, y, count = 2) {
                for (let i = 0; i < count; i++) {
                    const offsetX = (Math.random() - 0.5) * 60;
                    const offsetY = (Math.random() - 0.5) * 40;
                    particles.push({
                        x: (x + offsetX) / width,
                        y: (y + offsetY) / height,
                        size: 4 + Math.random() * 10,
                        speedY: 0.0005 + Math.random() * 0.001,
                        life: 1.0,
                        fadeSpeed: 0.002 + Math.random() * 0.003,
                        colorType: Math.random() > 0.6 ? 'gold' : 'cyan',
                        phase: Math.random() * Math.PI * 2,
                    });
                }
            }
            function onMouseMove(e) {
                const x = e.clientX;
                const y = e.clientY;
                if (Math.hypot(x - lastMouseX, y - lastMouseY) > 30) {
                    spawnBubbles(x, y, 1);
                    lastMouseX = x;
                    lastMouseY = y;
                }
            }
            function onTouchMove(e) {
                if (e.touches.length > 0) onMouseMove(e.touches[0]);
            }
            function updateParticles() {
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.y -= p.speedY;
                    p.x += Math.sin(Date.now() * 0.001 + p.phase) * 0.0003;
                    p.life -= p.fadeSpeed;
                    if (p.y < 0 || p.life <= 0) particles.splice(i, 1);
                }
            }
            function drawParticles() {
                ctx.clearRect(0, 0, width, height);
                for (let p of particles) {
                    const x = p.x * width, y = p.y * height;
                    const size = p.size * (0.8 + 0.4 * Math.sin(Date.now() * 0.002 + p.phase));
                    let c1, c2;
                    if (p.colorType === 'gold') {
                        c1 = `rgba(255,240,200,${p.life*0.8})`; c2 = `rgba(230,200,124,${p.life*0.3})`;
                    } else {
                        c1 = `rgba(200,255,240,${p.life*0.8})`; c2 = `rgba(0,212,200,${p.life*0.3})`;
                    }
                    const g = ctx.createRadialGradient(x-2, y-2, 1, x, y, size*1.5);
                    g.addColorStop(0, c1); g.addColorStop(0.6, c2); g.addColorStop(1, 'transparent');
                    ctx.beginPath(); ctx.arc(x, y, size, 0, Math.PI*2); ctx.fillStyle = g; ctx.fill();
                    ctx.beginPath(); ctx.arc(x-1, y-1, size*0.3, 0, Math.PI*2);
                    ctx.fillStyle = `rgba(255,255,255,${p.life*0.3})`; ctx.fill();
                }
            }
            function animate() { updateParticles(); drawParticles(); requestAnimationFrame(animate); }
            function setup() {
                resizeCanvas();
                window.addEventListener('mousemove', onMouseMove);
                window.addEventListener('touchmove', onTouchMove, { passive: true });
                animate();
            }
            window.addEventListener('resize', resizeCanvas);
            setup();
        })();
